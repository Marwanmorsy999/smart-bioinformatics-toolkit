name = "smart-bioinformatics-toolkit"
main = "worker.js"
compatibility_date = "2026-11-22"

# Workers static assets (verified against the local Wrangler 4.168.0 config
# schema). `run_worker_first = true` sends every request through worker.js;
# non-API paths are then explicitly delegated to env.ASSETS.fetch(request).
# NOTE: `pages_build_output_dir` was removed deliberately. In Wrangler 4.x the
# presence of that key marks the project as Cloudflare Pages and switches to
# Pages-specific validation, which conflicts with `main` + `assets`.
assets = { directory = "./public", binding = "ASSETS", run_worker_first = true }

# M7 feature flags. Everything defaults OFF. Secrets (API keys, signing key)
# are set only with `wrangler secret put` for each environment, never here.
[vars]
GALAXY_ENABLED = "false"
SMARTSBIO_ENABLED = "false"
NINEROUTER_ENABLED = "false"

# Private artifact storage is OPTIONAL and must be provisioned explicitly:
#   [[r2_buckets]] binding = "ARTIFACTS" bucket_name = "<private-bucket>"
#   wrangler secret put ARTIFACT_SIGNING_KEY [--env staging]
# Without both, artifact endpoints fail closed; no public bucket is assumed.

# Free-tier D1 database holding both BLAST requests and the AI control plane.
# The binding name MUST stay `BLAST_DB` (handlers read env.BLAST_DB).
[[d1_databases]]
binding = "BLAST_DB"
database_name = "smart-bioinformatics-toolkit-blast"
database_id = "d277fe22-f99d-46d8-9ae9-6de17942a6a9"

# Preview environment. Bindings are NOT inherited from the top level in
# Wrangler, so D1 and assets are repeated here. Secrets are set per environment
# with `wrangler secret put <NAME> --env staging` and are never committed.
[env.staging]
name = "smart-bioinformatics-toolkit-staging"
assets = { directory = "./public", binding = "ASSETS", run_worker_first = true }

[env.staging.vars]
# M7.2: Galaxy is the first enabled provider, staging only. Production stays off.
GALAXY_ENABLED = "true"
SMARTSBIO_ENABLED = "false"
NINEROUTER_ENABLED = "false"

# M7.1: staging now uses its OWN D1 database. Production keeps the original
# binding below; staging and production must never share a row space.
[[env.staging.d1_databases]]
binding = "BLAST_DB"
database_name = "smart-bioinformatics-toolkit-staging"
database_id = "72a07465-f0fe-4d32-93af-72bdc18b0cc0"
