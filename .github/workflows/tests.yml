name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r python-engine/requirements.txt
      - run: python -m pytest python-engine/tests

  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd web-platform && npm test

  plugin-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r python-engine/requirements.txt
      - name: Check plugin compliance and generated registry
        run: python scripts/check_plugins.py
      - name: Run plugin framework and template tests
        run: |
          python -m pytest -q python-engine/tests/test_plugin_framework.py
          python -m pytest -q docs/plugins/template/tests
